name: 'Less Hero'
description: Creates lesshero.html, a SLOC graph of your project
branding:
  icon: activity
inputs:
  ignore:
    description: 'Comma-separated repository-relative file paths to ignore across all history'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - '-ignore'
    - '${{ inputs.ignore }}'
